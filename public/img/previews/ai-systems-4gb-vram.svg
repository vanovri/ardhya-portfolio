    <text x="606" y="128" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#111317">FP16 Linear (840 MiB)</text>
    <rect x="606" y="138" width="420" height="22" rx="11" fill="#e2e8f0"/>
    <rect x="606" y="138" width="420" height="22" rx="11" fill="#94a3b8"/>
    <text x="606" y="190" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#111317">INT8 Group-64 (1.88x, PPL +0.30%)</text>
    <rect x="606" y="200" width="420" height="22" rx="11" fill="#e2e8f0"/>
    <rect x="606" y="200" width="224" height="22" rx="11" fill="url(#barBlue)"/>
    <text x="606" y="252" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#111317">INT4 Nibble-Packed (3.77x · GPTQ -67.70% L2)</text>
    <rect x="606" y="262" width="420" height="22" rx="11" fill="#e2e8f0"/>
    <rect x="606" y="262" width="112" height="22" rx="11" fill="#0b6b46"/>
    <rect x="734" y="258" width="290" height="30" rx="15" fill="#ebf8f1" stroke="#b4e5cd"/>
    <text x="879" y="278" text-anchor="middle" font-family="SF Mono, monospace" font-size="13" font-weight="700" fill="#0b6b46">LoRA INT4 236 MiB · 76.10% Acc</text>

    <!-- Right Bottom Card: LoRA Banking77 + Two-Tower + Hybrid RAG -->
    <rect x="576" y="348" width="484" height="286" rx="24" fill="#fbfbfd" stroke="#d2d2d7" stroke-width="1.5"/>
    <text x="606" y="388" font-family="SF Mono, monospace" font-size="13" font-weight="700" fill="#0b6b46">LORA + TWO-TOWER RECSYS + HYBRID RAG</text>
    <rect x="606" y="408" width="424" height="62" rx="14" fill="#ffffff" stroke="#d2d2d7"/>
    <text x="624" y="435" font-family="SF Mono, monospace" font-size="12" font-weight="700" fill="#535e70">#02 QWEN3-0.6B LORA (0.192% PARAMS · 1,305 MiB)</text>
    <text x="624" y="458" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#111317">0.00% Base -&gt; 84.59% Full Test (89.34% Top-3)</text>
    <rect x="606" y="482" width="424" height="62" rx="14" fill="#ffffff" stroke="#d2d2d7"/>
    <text x="624" y="509" font-family="SF Mono, monospace" font-size="12" font-weight="700" fill="#535e70">#01 TWO-TOWER RECSYS (LOG-Q DEBIASING)</text>
    <text x="624" y="532" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#111317">4.23x Recall@10 · -51.5% Viral Bias · 0.105 ms</text>
    <rect x="606" y="556" width="424" height="58" rx="14" fill="#ebf3fe" stroke="#bbd5fa"/>
    <text x="624" y="591" font-family="SF Mono, monospace" font-size="14" font-weight="700" fill="#0b5fc4">#06 RAG 1.00 MRR · #03 Agent 3/3 · #09 100% Minimax</text>
  </g>

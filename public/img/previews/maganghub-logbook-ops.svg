<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="MagangHub Logbook Ops Apple-studio illustration featuring a structured daily logbook sheet with machined CLI badge, privacy claim-boundary shield filter, and multi-format export fan-out">
  <title>MagangHub Logbook Ops project illustration</title>
  <defs>
    <linearGradient id="bgGradOuter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbfbfd"/>
      <stop offset="100%" stop-color="#f2f2f7"/>
    </linearGradient>
    <filter id="softShadowOuter" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
    <filter id="chipShadow" x="-16%" y="-16%" width="132%" height="138%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <filter id="nodeShadow" x="-18%" y="-18%" width="136%" height="142%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>
    <pattern id="studioDots" x="61" y="49" width="38" height="38" patternUnits="userSpaceOnUse">
      <circle cx="19" cy="19" r="1.35" fill="#dcdce2"/>
    </pattern>
    <clipPath id="outerCardClip">
      <rect x="64" y="52" width="1072" height="646" rx="22"/>
    </clipPath>
    <linearGradient id="substrateGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="dieSapphire" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="48%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="dieSpecular" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.24"/>
      <stop offset="55%" stop-color="#7dd3fc" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="emeraldSeal" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="55%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="glassBevel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="docShadow" x="-14%" y="-14%" width="128%" height="132%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Outer Studio Canvas + Floating White Frame -->
  <rect width="1200" height="750" fill="url(#bgGradOuter)"/>
  <rect x="48" y="36" width="1104" height="678" rx="30" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.5" filter="url(#softShadowOuter)"/>
  <rect x="64" y="52" width="1072" height="646" rx="22" fill="url(#studioDots)" clip-path="url(#outerCardClip)"/>

  <g transform="translate(48, 36)">

    <!-- LEFT HERO CARD: Structured Daily Logbook Sheet & Machined Agent CLI Core -->
    <rect x="54" y="54" width="492" height="570" rx="24" fill="#fbfbfd" stroke="#d2d2d7" stroke-width="1.5"/>

    <!-- Concentric Aura Rings -->
    <circle cx="300" cy="290" r="182" fill="#f4f8ff" opacity="0.62" stroke="#93c5fd" stroke-width="2" stroke-dasharray="8 6"/>
    <circle cx="300" cy="290" r="134" fill="#ffffff" opacity="0.78" stroke="#dbeafe" stroke-width="2"/>

    <!-- Grounded Dual Contact Shadows -->
    <ellipse cx="272" cy="466" rx="138" ry="15" fill="#cbd5e1" opacity="0.46"/>
    <ellipse cx="408" cy="462" rx="64" ry="10" fill="#cbd5e1" opacity="0.44"/>

    <!-- Floating Apple-Studio Structured Logbook Window -->
    <g transform="translate(-8, 0)">
      <rect x="132" y="122" width="292" height="328" rx="22" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.8" filter="url(#docShadow)"/>
      <!-- macOS Chrome Titlebar -->
      <path d="M 132 144 A 22 22 0 0 1 154 122 H 402 A 22 22 0 0 1 424 144 V 162 H 132 Z" fill="#f5f5f7"/>
      <line x1="132" y1="162" x2="424" y2="162" stroke="#e5e5ea" stroke-width="1.2"/>
      <circle cx="156" cy="142" r="5" fill="#ff5f57"/>
      <circle cx="173" cy="142" r="5" fill="#febc2e"/>
      <circle cx="190" cy="142" r="5" fill="#28c840"/>
      <!-- Header Pill Capsule -->
      <rect x="214" y="132" width="184" height="20" rx="10" fill="#ffffff" stroke="#e5e5ea" stroke-width="1.2"/>
      <circle cx="228" cy="142" r="4.2" fill="#0071e3"/>
      <rect x="240" y="139" width="108" height="6" rx="3" fill="#0071e3" opacity="0.55"/>

      <!-- Daily Logbook Structured Entry Rows -->
      <rect x="158" y="184" width="136" height="13" rx="6.5" fill="#1d1d1f" opacity="0.82"/>
      <rect x="158" y="206" width="92" height="8.5" rx="4.25" fill="#94a3b8"/>

      <rect x="158" y="234" width="240" height="48" rx="13" fill="#eaf2ff" stroke="#b8d4ff" stroke-width="1.5"/>
      <circle cx="182" cy="258" r="10" fill="#0071e3"/>
      <path d="M 177.5 258 L 180.8 261.2 L 186.8 254.8" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="202" y="249" width="142" height="7.5" rx="3.75" fill="#0071e3" opacity="0.78"/>
      <rect x="202" y="263" width="94" height="6.5" rx="3.25" fill="#0071e3" opacity="0.40"/>

      <rect x="158" y="294" width="240" height="48" rx="13" fill="#e6f7f5" stroke="#99f6e4" stroke-width="1.5"/>
      <circle cx="182" cy="318" r="10" fill="#0d9488"/>
      <path d="M 177.5 318 L 180.8 321.2 L 186.8 314.8" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="202" y="309" width="132" height="7.5" rx="3.75" fill="#0d9488" opacity="0.78"/>
      <rect x="202" y="323" width="104" height="6.5" rx="3.25" fill="#0d9488" opacity="0.40"/>

      <rect x="158" y="354" width="240" height="48" rx="13" fill="#efeffc" stroke="#c7d2fe" stroke-width="1.5"/>
      <circle cx="182" cy="378" r="10" fill="#5856d6"/>
      <path d="M 177.5 378 L 180.8 381.2 L 186.8 374.8" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="202" y="369" width="118" height="7.5" rx="3.75" fill="#5856d6" opacity="0.78"/>
      <rect x="202" y="383" width="84" height="6.5" rx="3.25" fill="#5856d6" opacity="0.40"/>

      <!-- Centerpiece Foreground: Machined Sapphire-Graphite Skill CLI Badge -->
      <rect x="330" y="326" width="144" height="122" rx="26" fill="url(#substrateGrad)" stroke="#93c5fd" stroke-width="2.4" filter="url(#chipShadow)"/>
      <rect x="339" y="335" width="126" height="104" rx="19" fill="url(#dieSapphire)" stroke="#0f172a" stroke-width="2"/>
      <path d="M 358 337 H 446 A 17 17 0 0 1 463 354 V 382 L 341 412 V 354 A 17 17 0 0 1 358 337 Z" fill="url(#dieSpecular)"/>
      <!-- Crisp Terminal Prompt >_ Glyph -->
      <path d="M 366 372 L 386 387 L 366 402" fill="none" stroke="#38bdf8" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="398" y1="402" x2="426" y2="402" stroke="#34d399" stroke-width="5.5" stroke-linecap="round"/>
      <!-- Inset Emerald Verified Seal -->
      <circle cx="456" cy="432" r="18" fill="#ffffff" stroke="#a7f3d0" stroke-width="2.6"/>
      <circle cx="456" cy="432" r="12.5" fill="#10b981"/>
      <path d="M 450.5 432 L 454.5 436 L 462 427.5" fill="none" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Left Card Bottom Pill -->
    <rect x="188" y="546" width="224" height="36" rx="18" fill="#eaf2ff"/>
    <text x="300" y="569" text-anchor="middle" font-family="SF Mono, ui-monospace, monospace" font-size="14" font-weight="700" fill="#0071e3">Logbook Skill · CLI</text>

    <!-- RIGHT TOP CARD: Privacy & Claim-Boundary Sanitization Filter -->
    <rect x="574" y="54" width="476" height="272" rx="24" fill="#fbfbfd" stroke="#d2d2d7" stroke-width="1.5"/>

    <!-- Flow Connectors -->
    <line x1="678" y1="148" x2="734" y2="148" stroke="#f59e0b" stroke-width="4" stroke-dasharray="7 5" stroke-linecap="round"/>
    <line x1="814" y1="148" x2="878" y2="148" stroke="#0d9488" stroke-width="4" stroke-linecap="round"/>
    <!-- Redacted PII Drop Branch -->
    <path d="M 774 188 V 222 H 654" fill="none" stroke="#ff3b30" stroke-width="3.4" stroke-dasharray="6 5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="642" cy="222" r="14" fill="#ffeceb" stroke="#ff3b30" stroke-width="2.8"/>
    <path d="M 637 217 L 647 227 M 647 217 L 637 227" stroke="#ff3b30" stroke-width="2.8" stroke-linecap="round"/>

    <!-- Stage 1: Local Raw Draft Notes -->
    <rect x="610" y="114" width="68" height="68" rx="18" fill="#fff6e5" stroke="#f59e0b" stroke-width="3.2"/>
    <rect x="626" y="132" width="36" height="6" rx="3" fill="#f59e0b"/>
    <rect x="626" y="145" width="28" height="6" rx="3" fill="#f59e0b" opacity="0.65"/>
    <rect x="626" y="158" width="22" height="6" rx="3" fill="#f59e0b" opacity="0.45"/>

    <!-- Stage 2: Claim-Boundary Privacy Shield Gate -->
    <rect x="734" y="108" width="80" height="80" rx="20" fill="#eaf2ff" stroke="#0071e3" stroke-width="3.6"/>
    <path d="M 774 126 L 796 134 V 151 C 796 164, 786 172, 774 177 C 762 172, 752 164, 752 151 V 134 Z" fill="#0071e3"/>
    <path d="M 766 151 L 772 157 L 783 144" fill="none" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Stage 3: Sanitized SIAPkerja Ready Card -->
    <rect x="878" y="108" width="132" height="80" rx="18" fill="#eaf8ee" stroke="#10b981" stroke-width="3"/>
    <rect x="896" y="128" width="62" height="7" rx="3.5" fill="#0d9488"/>
    <rect x="896" y="143" width="48" height="6.5" rx="3.25" fill="#10b981" opacity="0.60"/>
    <rect x="896" y="158" width="54" height="6.5" rx="3.25" fill="#10b981" opacity="0.40"/>
    <circle cx="984" cy="148" r="15" fill="#28a745"/>
    <path d="M 978 148 L 982.5 152.5 L 991 143.5" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Right Top Bottom Pill -->
    <rect x="692" y="264" width="240" height="36" rx="18" fill="#e6f7f5"/>
    <text x="812" y="287" text-anchor="middle" font-family="SF Mono, ui-monospace, monospace" font-size="14" font-weight="700" fill="#0d9488">Claim-Boundary Guard</text>

    <!-- RIGHT BOTTOM CARD: Multi-Format Export Fan-Out (CSV / Markdown / Portal Ready) -->
    <rect x="574" y="352" width="476" height="272" rx="24" fill="#fbfbfd" stroke="#d2d2d7" stroke-width="1.5"/>

    <!-- Fan-Out Curves -->
    <path d="M 702 460 C 748 460, 756 408, 804 408" fill="none" stroke="#0071e3" stroke-width="3.6" stroke-linecap="round"/>
    <line x1="702" y1="460" x2="804" y2="460" stroke="#0d9488" stroke-width="3.6" stroke-linecap="round"/>
    <path d="M 702 460 C 748 460, 756 512, 804 512" fill="none" stroke="#5856d6" stroke-width="3.6" stroke-linecap="round"/>

    <!-- Left Hub: Python / Skill Engine Node -->
    <rect x="622" y="422" width="80" height="76" rx="20" fill="#efeffc" stroke="#5856d6" stroke-width="3.5"/>
    <rect x="640" y="440" width="18" height="16" rx="4.5" fill="#5856d6"/>
    <rect x="664" y="440" width="18" height="16" rx="4.5" fill="#0071e3"/>
    <rect x="640" y="462" width="42" height="16" rx="4.5" fill="#0d9488" opacity="0.85"/>

    <!-- Right Stack: 3 Export Artifact Cards -->
    <!-- Export 1: CSV Table -->
    <rect x="804" y="388" width="204" height="40" rx="12" fill="#eaf2ff" stroke="#0071e3" stroke-width="2.4"/>
    <rect x="820" y="401" width="38" height="14" rx="4" fill="#0071e3" opacity="0.85"/>
    <rect x="866" y="401" width="46" height="14" rx="4" fill="#0071e3" opacity="0.45"/>
    <rect x="920" y="401" width="42" height="14" rx="4" fill="#0071e3" opacity="0.28"/>
    <circle cx="988" cy="408" r="8" fill="#0071e3"/>

    <!-- Export 2: Markdown Summary -->
    <rect x="804" y="440" width="204" height="40" rx="12" fill="#e6f7f5" stroke="#0d9488" stroke-width="2.4"/>
    <rect x="820" y="452" width="84" height="6.5" rx="3.25" fill="#0d9488" opacity="0.85"/>
    <rect x="820" y="463" width="118" height="5.5" rx="2.75" fill="#0d9488" opacity="0.42"/>
    <circle cx="988" cy="460" r="8" fill="#0d9488"/>

    <!-- Export 3: SIAPkerja Verified Payload -->
    <rect x="804" y="492" width="204" height="40" rx="12" fill="#efeffc" stroke="#5856d6" stroke-width="2.4"/>
    <rect x="820" y="504" width="98" height="6.5" rx="3.25" fill="#5856d6" opacity="0.85"/>
    <rect x="820" y="515" width="76" height="5.5" rx="2.75" fill="#5856d6" opacity="0.42"/>
    <circle cx="988" cy="512" r="10" fill="#10b981"/>
    <path d="M 983.5 512 L 986.8 515.2 L 992.5 509" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Right Bottom Pill -->
    <rect x="692" y="564" width="240" height="36" rx="18" fill="#efeffc"/>
    <text x="812" y="587" text-anchor="middle" font-family="SF Mono, ui-monospace, monospace" font-size="14" font-weight="700" fill="#5856d6">CSV · Markdown · Export</text>
  </g>
</svg>

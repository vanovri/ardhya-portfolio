<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="prompt-shield-eval 5-layer LLM prompt injection defense pipeline, 100% TPR / 0% FPR evaluation scorecard, and sub-millisecond anti-ReDoS latency bars">
  <title>prompt-shield-eval project illustration</title>
  <defs>
    <linearGradient id="bgGradShield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbfbfd"/>
      <stop offset="100%" stop-color="#f2f2f7"/>
    </linearGradient>
    <filter id="softShadowShield" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>
  <rect width="1200" height="750" fill="url(#bgGradShield)"/>
  <rect x="48" y="36" width="1104" height="678" rx="30" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.5" filter="url(#softShadowShield)"/>
  <g transform="translate(48, 36)">
    <!-- LEFT CARD: 5-Layer Defense-in-Depth Stack -->
    <rect x="54" y="54" width="480" height="570" rx="24" fill="#fbfbfd" stroke="#d2d2d7" stroke-width="1.5"/>
    <text x="90" y="102" font-family="SF Mono, monospace" font-size="14" font-weight="700" fill="#6e6e73">5-LAYER PROMPT INJECTION DEFENSE</text>

    <!-- Vertical Pipeline Spine -->
    <line x1="126" y1="150" x2="126" y2="514" stroke="#0071e3" stroke-width="3" stroke-dasharray="6 5"/>

    <!-- Layer 1 -->
    <rect x="90" y="124" width="408" height="66" rx="14" fill="#ffffff" stroke="#0071e3" stroke-width="2"/>
    <circle cx="126" cy="157" r="14" fill="#0071e3"/>
    <text x="126" y="162" text-anchor="middle" font-family="SF Mono, monospace" font-size="12" font-weight="700" fill="#ffffff">L1</text>
    <text x="156" y="152" font-family="SF Pro Text, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#1d1d1f">NFKC / Homoglyph / Leet Normalizer</text>
    <text x="156" y="174" font-family="SF Mono, monospace" font-size="12" fill="#6e6e73">Depth-2 decode · O(N) linear comment scanner</text>

    <!-- Layer 2 -->
    <rect x="90" y="206" width="408" height="66" rx="14" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
    <circle cx="126" cy="239" r="14" fill="#0d9488"/>
    <text x="126" y="244" text-anchor="middle" font-family="SF Mono, monospace" font-size="12" font-weight="700" fill="#ffffff">L2</text>
    <text x="156" y="234" font-family="SF Pro Text, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#1d1d1f">Multi-Turn Sliding Window</text>
    <text x="156" y="256" font-family="SF Mono, monospace" font-size="12" fill="#6e6e73">Cross-turn split-payload assembly detection</text>

    <!-- Layer 3 -->
    <rect x="90" y="288" width="408" height="66" rx="14" fill="#ffffff" stroke="#5856d6" stroke-width="2"/>
    <circle cx="126" cy="321" r="14" fill="#5856d6"/>
    <text x="126" y="326" text-anchor="middle" font-family="SF Mono, monospace" font-size="12" font-weight="700" fill="#ffffff">L3</text>
    <text x="156" y="316" font-family="SF Pro Text, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#1d1d1f">16-ID Bilingual Rule Scorer (EN/ID)</text>
    <text x="156" y="338" font-family="SF Mono, monospace" font-size="12" fill="#6e6e73">PI-01..PI-14C · OWASP LLM01 / LLM06 / LLM07</text>

    <!-- Layer 4 -->
    <rect x="90" y="370" width="408" height="66" rx="14" fill="#ffffff" stroke="#0071e3" stroke-width="2"/>
    <circle cx="126" cy="403" r="14" fill="#0071e3"/>
    <text x="126" y="408" text-anchor="middle" font-family="SF Mono, monospace" font-size="12" font-weight="700" fill="#ffffff">L4</text>
    <text x="156" y="398" font-family="SF Pro Text, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#1d1d1f">128-Bit Nonce Trust Boundary</text>
    <text x="156" y="420" font-family="SF Mono, monospace" font-size="12" fill="#6e6e73">Cryptographic delimiter isolation · 0 deps</text>

    <!-- Layer 5 -->
    <rect x="90" y="452" width="408" height="66" rx="14" fill="#ffffff" stroke="#28a745" stroke-width="2"/>
    <circle cx="126" cy="485" r="14" fill="#28a745"/>
    <text x="126" y="490" text-anchor="middle" font-family="SF Mono, monospace" font-size="12" font-weight="700" fill="#ffffff">L5</text>
    <text x="156" y="480" font-family="SF Pro Text, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#1d1d1f">Canary / 4-Gram &amp; Taint HITL Gate</text>
    <text x="156" y="502" font-family="SF Mono, monospace" font-size="12" fill="#6e6e73">Leak detection + taint-aware tool approval</text>

    <rect x="134" y="546" width="320" height="36" rx="18" fill="#eaf2ff"/>
    <text x="294" y="569" text-anchor="middle" font-family="SF Mono, monospace" font-size="13" font-weight="700" fill="#0071e3">TypeScript 5.7 Strict · Zero Runtime Deps</text>

    <!-- RIGHT TOP CARD: Red-Team Evaluation Scorecard -->
    <rect x="562" y="54" width="488" height="272" rx="24" fill="#fbfbfd" stroke="#d2d2d7" stroke-width="1.5"/>
    <text x="602" y="96" font-family="SF Mono, monospace" font-size="14" font-weight="700" fill="#6e6e73">RED-TEAM EVAL HARNESS (26 CASES)</text>

    <rect x="602" y="118" width="194" height="84" rx="16" fill="#eaf8ee" stroke="#bbf7d0" stroke-width="1.5"/>
    <text x="699" y="156" text-anchor="middle" font-family="SF Mono, monospace" font-size="28" font-weight="700" fill="#15803d">100% TPR</text>
    <text x="699" y="182" text-anchor="middle" font-family="SF Mono, monospace" font-size="12" fill="#166534">20/20 Attacks Caught</text>

    <rect x="816" y="118" width="194" height="84" rx="16" fill="#eaf2ff" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="913" y="156" text-anchor="middle" font-family="SF Mono, monospace" font-size="28" font-weight="700" fill="#0071e3">0% FPR</text>
    <text x="913" y="182" text-anchor="middle" font-family="SF Mono, monospace" font-size="12" fill="#1d4ed8">6/6 Hard Negatives</text>

    <rect x="602" y="220" width="408" height="34" rx="12" fill="#ffffff" stroke="#d2d2d7"/>
    <text x="806" y="242" text-anchor="middle" font-family="SF Mono, monospace" font-size="13" font-weight="700" fill="#1d1d1f">100% Exact Decision Match · 16/16 IDs · 0 Fails</text>

    <rect x="602" y="268" width="194" height="34" rx="17" fill="#f3f0ff"/>
    <text x="699" y="290" text-anchor="middle" font-family="SF Mono, monospace" font-size="13" font-weight="700" fill="#5856d6">17/17 Vitest PASS</text>
    <rect x="816" y="268" width="194" height="34" rx="17" fill="#ecfeff"/>
    <text x="913" y="290" text-anchor="middle" font-family="SF Mono, monospace" font-size="13" font-weight="700" fill="#0e7490">480+ Fuzz Seeds</text>

    <!-- RIGHT BOTTOM CARD: Hot-Path Latency & Anti-ReDoS -->
    <rect x="562" y="352" width="488" height="272" rx="24" fill="#fbfbfd" stroke="#d2d2d7" stroke-width="1.5"/>
    <text x="602" y="394" font-family="SF Mono, monospace" font-size="14" font-weight="700" fill="#6e6e73">HOT-PATH LATENCY &amp; ANTI-ReDoS (NODE 24)</text>

    <text x="602" y="432" font-family="SF Mono, monospace" font-size="13" font-weight="700" fill="#1d1d1f">p50 Warm</text>
    <rect x="720" y="416" width="54" height="22" rx="11" fill="#10b981"/>
    <text x="786" y="432" font-family="SF Mono, monospace" font-size="13" font-weight="700" fill="#15803d">0.054 ms</text>

    <text x="602" y="476" font-family="SF Mono, monospace" font-size="13" font-weight="700" fill="#1d1d1f">p99 Warm</text>
    <rect x="720" y="460" width="128" height="22" rx="11" fill="#0071e3"/>
    <text x="860" y="476" font-family="SF Mono, monospace" font-size="13" font-weight="700" fill="#0071e3">0.620 ms</text>

    <text x="602" y="520" font-family="SF Mono, monospace" font-size="13" font-weight="700" fill="#1d1d1f">CI Gate</text>
    <rect x="720" y="504" width="230" height="22" rx="11" fill="#e5e5ea"/>
    <rect x="720" y="504" width="28" height="22" rx="11" fill="#0d9488"/>
    <text x="960" y="520" font-family="SF Mono, monospace" font-size="12" font-weight="700" fill="#6e6e73">&lt;5ms</text>

    <rect x="602" y="552" width="408" height="44" rx="14" fill="#ffffff" stroke="#d2d2d7"/>
    <text x="806" y="579" text-anchor="middle" font-family="SF Mono, monospace" font-size="13" font-weight="700" fill="#1d1d1f">10 × 20–50 KB Pathological Payloads &lt; 50 ms</text>
  </g>
</svg>

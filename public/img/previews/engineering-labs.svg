<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Engineering Labs Apple-studio illustration featuring a machined Rust WebAssembly silicon die with 6 studio modules, a filtered synthetic EMG DSP oscilloscope trace, and a fragmented UART newline framing pipeline">
  <title>Engineering Labs project illustration</title>
  <defs>
    <linearGradient id="bgGradOuter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbfbfd"/>
      <stop offset="100%" stop-color="#f2f2f7"/>
    </linearGradient>
    <filter id="softShadowOuter" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
    <filter id="chipShadow" x="-16%" y="-16%" width="132%" height="138%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <filter id="nodeShadow" x="-18%" y="-18%" width="136%" height="142%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>
    <pattern id="studioDots" x="61" y="49" width="38" height="38" patternUnits="userSpaceOnUse">
      <circle cx="19" cy="19" r="1.35" fill="#dcdce2"/>
    </pattern>
    <clipPath id="outerCardClip">
      <rect x="64" y="52" width="1072" height="646" rx="22"/>
    </clipPath>
    <linearGradient id="substrateGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="dieSapphire" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="48%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="dieSpecular" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.24"/>
      <stop offset="55%" stop-color="#7dd3fc" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="emgAreaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0071e3" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="emgStrokeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5856d6"/>
      <stop offset="48%" stop-color="#0071e3"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <!-- Outer Studio Canvas + Floating White Frame -->
  <rect width="1200" height="750" fill="url(#bgGradOuter)"/>
  <rect x="48" y="36" width="1104" height="678" rx="30" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.5" filter="url(#softShadowOuter)"/>
  <rect x="64" y="52" width="1072" height="646" rx="22" fill="url(#studioDots)" clip-path="url(#outerCardClip)"/>

  <g transform="translate(48, 36)">

    <!-- LEFT HERO CARD: 6 Rust/WebAssembly Systems Studios &amp; Machined Silicon Die -->
    <rect x="54" y="54" width="492" height="570" rx="24" fill="#fbfbfd" stroke="#d2d2d7" stroke-width="1.5"/>

    <!-- Concentric Compute Aura Rings -->
    <circle cx="300" cy="288" r="182" fill="#f4f8ff" opacity="0.65" stroke="#93c5fd" stroke-width="2" stroke-dasharray="8 6"/>
    <circle cx="300" cy="288" r="126" fill="#ffffff" opacity="0.78" stroke="#dbeafe" stroke-width="2"/>

    <!-- Hexagonal Bus Ring &amp; 6 Radial Studio Traces -->
    <polygon points="300,136 432,212 432,364 300,440 168,364 168,212" fill="none" stroke="#dbeafe" stroke-width="2.2" stroke-dasharray="5 5"/>
    <line x1="300" y1="164" x2="300" y2="212" stroke="#0071e3" stroke-width="3.6" stroke-linecap="round" opacity="0.75"/>
    <line x1="406" y1="227" x2="366" y2="250" stroke="#0d9488" stroke-width="3.6" stroke-linecap="round" opacity="0.75"/>
    <line x1="406" y1="349" x2="366" y2="326" stroke="#10b981" stroke-width="3.6" stroke-linecap="round" opacity="0.75"/>
    <line x1="300" y1="412" x2="300" y2="364" stroke="#5856d6" stroke-width="3.6" stroke-linecap="round" opacity="0.75"/>
    <line x1="194" y1="349" x2="234" y2="326" stroke="#0284c7" stroke-width="3.6" stroke-linecap="round" opacity="0.75"/>
    <line x1="194" y1="227" x2="234" y2="250" stroke="#5856d6" stroke-width="3.6" stroke-linecap="round" opacity="0.75"/>

    <!-- Grounded Studio Contact Shadow -->
    <ellipse cx="300" cy="390" rx="86" ry="12" fill="#cbd5e1" opacity="0.50"/>

    <!-- 6 Verified WASM Studio Satellite Modules -->
    <!-- 01 Top: VectraDB (Columnar SQL) -->
    <g transform="translate(300, 136)" filter="url(#nodeShadow)">
      <rect x="-28" y="-28" width="56" height="56" rx="16" fill="#ffffff" stroke="#0071e3" stroke-width="2.6"/>
      <rect x="-21" y="-21" width="42" height="42" rx="11" fill="#eaf2ff"/>
      <rect x="-13" y="-11" width="6.5" height="22" rx="2.5" fill="#0071e3"/>
      <rect x="-3.25" y="-11" width="6.5" height="15" rx="2.5" fill="#38bdf8"/>
      <rect x="6.5" y="-11" width="6.5" height="22" rx="2.5" fill="#0071e3" opacity="0.65"/>
    </g>

    <!-- 02 Top-Right: KronosLOB (L3 Order Book Ladder) -->
    <g transform="translate(432, 212)" filter="url(#nodeShadow)">
      <rect x="-28" y="-28" width="56" height="56" rx="16" fill="#ffffff" stroke="#0d9488" stroke-width="2.6"/>
      <rect x="-21" y="-21" width="42" height="42" rx="11" fill="#e6f7f5"/>
      <rect x="-14" y="-11" width="12" height="4.5" rx="2.2" fill="#0d9488"/>
      <rect x="-14" y="-3" width="9" height="4.5" rx="2.2" fill="#0d9488" opacity="0.72"/>
      <rect x="-14" y="5" width="6" height="4.5" rx="2.2" fill="#0d9488" opacity="0.48"/>
      <line x1="0" y1="-13" x2="0" y2="12" stroke="#99f6e4" stroke-width="2" stroke-linecap="round"/>
      <rect x="4" y="-11" width="6" height="4.5" rx="2.2" fill="#5856d6" opacity="0.52"/>
      <rect x="4" y="-3" width="9" height="4.5" rx="2.2" fill="#5856d6" opacity="0.78"/>
      <rect x="4" y="5" width="11" height="4.5" rx="2.2" fill="#5856d6"/>
    </g>

    <!-- 03 Bottom-Right: AegisBox (Sandbox Shield) -->
    <g transform="translate(432, 364)" filter="url(#nodeShadow)">
      <rect x="-28" y="-28" width="56" height="56" rx="16" fill="#ffffff" stroke="#10b981" stroke-width="2.6"/>
      <rect x="-21" y="-21" width="42" height="42" rx="11" fill="#eaf8ee"/>
      <path d="M 0 -13 L 11 -9 V 0 C 11 7, 6 11, 0 14 C -6 11, -11 7, -11 0 V -9 Z" fill="#10b981"/>
      <path d="M -4.5 0 L -1 3.5 L 5 -3.5" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- 04 Bottom: NovaServe (Paged KV Blocks) -->
    <g transform="translate(300, 440)" filter="url(#nodeShadow)">
      <rect x="-28" y="-28" width="56" height="56" rx="16" fill="#ffffff" stroke="#5856d6" stroke-width="2.6"/>
      <rect x="-21" y="-21" width="42" height="42" rx="11" fill="#efeffc"/>
      <rect x="-13" y="-12" width="10" height="10" rx="3" fill="#5856d6"/>
      <rect x="2" y="-12" width="10" height="10" rx="3" fill="#0071e3"/>
      <rect x="-13" y="2" width="10" height="10" rx="3" fill="#0d9488"/>
      <rect x="2" y="2" width="10" height="10" rx="3" fill="#5856d6" opacity="0.45"/>
    </g>

    <!-- 05 Bottom-Left: SpectreMesh (eBPF Mesh) -->
    <g transform="translate(168, 364)" filter="url(#nodeShadow)">
      <rect x="-28" y="-28" width="56" height="56" rx="16" fill="#ffffff" stroke="#0284c7" stroke-width="2.6"/>
      <rect x="-21" y="-21" width="42" height="42" rx="11" fill="#e0f2fe"/>
      <line x1="-10" y1="8" x2="0" y2="-10" stroke="#0284c7" stroke-width="2.4"/>
      <line x1="10" y1="8" x2="0" y2="-10" stroke="#0284c7" stroke-width="2.4"/>
      <line x1="-10" y1="8" x2="10" y2="8" stroke="#0284c7" stroke-width="2.4"/>
      <circle cx="0" cy="-10" r="4.2" fill="#0071e3"/>
      <circle cx="-10" cy="8" r="4.2" fill="#0d9488"/>
      <circle cx="10" cy="8" r="4.2" fill="#5856d6"/>
      <circle cx="0" cy="2" r="3.4" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    </g>

    <!-- 06 Top-Left: DST-KV (Deterministic Raft Consensus) -->
    <g transform="translate(168, 212)" filter="url(#nodeShadow)">
      <rect x="-28" y="-28" width="56" height="56" rx="16" fill="#ffffff" stroke="#5856d6" stroke-width="2.6"/>
      <rect x="-21" y="-21" width="42" height="42" rx="11" fill="#efeffc"/>
      <rect x="-13" y="-11" width="26" height="5.5" rx="2.75" fill="#5856d6"/>
      <rect x="-13" y="-2.5" width="20" height="5.5" rx="2.75" fill="#0071e3"/>
      <rect x="-13" y="6" width="14" height="5.5" rx="2.75" fill="#0d9488"/>
    </g>

    <!-- Centerpiece: Machined Aluminum Substrate &amp; Brushed Sapphire-Graphite Rust WASM Silicon Die -->
    <rect x="224" y="212" width="152" height="152" rx="30" fill="url(#substrateGrad)" stroke="#93c5fd" stroke-width="2.5" filter="url(#chipShadow)"/>
    <rect x="232" y="220" width="136" height="136" rx="23" fill="#eaf2ff" stroke="#ffffff" stroke-width="2"/>
    <rect x="242" y="230" width="116" height="116" rx="18" fill="url(#dieSapphire)" stroke="#0f172a" stroke-width="2"/>
    <path d="M 260 232 H 340 A 16 16 0 0 1 356 248 V 278 L 244 316 V 248 A 16 16 0 0 1 260 232 Z" fill="url(#dieSpecular)"/>
    <rect x="248" y="236" width="104" height="104" rx="13" fill="none" stroke="#ffffff" stroke-width="1.3" opacity="0.22"/>

    <!-- Precision WASM Code Kernel &amp; SIMD128 Vector Lanes inside Die -->
    <g fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 284 264 L 272 276 L 284 288"/>
      <path d="M 316 264 L 328 276 L 316 288"/>
      <path d="M 304 260 L 296 292" stroke="#7dd3fc"/>
    </g>
    <!-- 4-Lane SIMD128 Micro-Bars -->
    <rect x="266" y="308" width="14" height="6" rx="3" fill="#38bdf8"/>
    <rect x="284" y="308" width="14" height="6" rx="3" fill="#60a5fa"/>
    <rect x="302" y="308" width="14" height="6" rx="3" fill="#34d399"/>
    <rect x="320" y="308" width="14" height="6" rx="3" fill="#818cf8"/>

    <!-- Verified Emerald Micro-Seal Inset Cleanly on Lower-Right Die Corner -->
    <circle cx="352" cy="340" r="18" fill="#ffffff" stroke="#a7f3d0" stroke-width="2.6"/>
    <circle cx="352" cy="340" r="12.5" fill="#10b981"/>
    <path d="M 346.5 340 L 350.5 344 L 358 335.5" fill="none" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Left Card Bottom Pill -->
    <rect x="184" y="546" width="232" height="36" rx="18" fill="#eaf2ff"/>
    <text x="300" y="569" text-anchor="middle" font-family="SF Mono, ui-monospace, monospace" font-size="14" font-weight="700" fill="#0071e3">6 WASM Studios · Rust</text>

    <!-- RIGHT TOP CARD: Synthetic EMG DSP Oscilloscope (20 Hz HPF · 500 Hz LPF · 50 Hz Notch) -->
    <rect x="574" y="54" width="476" height="272" rx="24" fill="#fbfbfd" stroke="#d2d2d7" stroke-width="1.5"/>

    <!-- Precision Oscilloscope Viewport -->
    <rect x="610" y="82" width="404" height="156" rx="18" fill="#ffffff" stroke="#e5e5ea" stroke-width="2"/>
    <!-- RMS Feature Window Highlight Band -->
    <rect x="762" y="88" width="118" height="144" rx="10" fill="#eaf2ff" opacity="0.52"/>
    <!-- Subtle Instrument Graticule -->
    <line x1="624" y1="114" x2="1000" y2="114" stroke="#f1f5f9" stroke-width="1.4"/>
    <line x1="624" y1="146" x2="1000" y2="146" stroke="#f1f5f9" stroke-width="1.4"/>
    <line x1="624" y1="178" x2="1000" y2="178" stroke="#e2e8f0" stroke-width="1.6"/>
    <line x1="624" y1="210" x2="1000" y2="210" stroke="#f1f5f9" stroke-width="1.4"/>
    <line x1="704" y1="92" x2="704" y2="228" stroke="#f1f5f9" stroke-width="1.4"/>
    <line x1="762" y1="92" x2="762" y2="228" stroke="#bfdbfe" stroke-width="1.6" stroke-dasharray="4 4"/>
    <line x1="880" y1="92" x2="880" y2="228" stroke="#bfdbfe" stroke-width="1.6" stroke-dasharray="4 4"/>
    <line x1="944" y1="92" x2="944" y2="228" stroke="#f1f5f9" stroke-width="1.4"/>

    <!-- Unfiltered Raw Noisy 50 Hz + Drift Trace -->
    <polyline points="624,186 636,174 648,191 660,171 672,188 684,169 696,184 708,162 720,185 732,155 744,186 756,158 768,192 780,142 792,196 804,124 816,188 828,108 840,192 852,130 864,182 876,144 888,180 900,152 912,179 924,158 936,178 948,162 960,182 972,164 984,180 1000,170" fill="none" stroke="#cbd5e1" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Filtered Clean EMG Envelope Area &amp; Curve -->
    <path d="M 624 178 C 652 178, 678 177, 704 174 C 730 171, 748 164, 766 154 C 782 145, 796 124, 810 116 C 818 111, 824 108, 830 110 C 844 115, 858 142, 878 156 C 900 171, 932 176, 1000 178 L 1000 178 L 624 178 Z" fill="url(#emgAreaGrad)"/>
    <path d="M 624 178 C 652 178, 678 177, 704 174 C 730 171, 748 164, 766 154 C 782 145, 796 124, 810 116 C 818 111, 824 108, 830 110 C 844 115, 858 142, 878 156 C 900 171, 932 176, 1000 178" fill="none" stroke="url(#emgStrokeGrad)" stroke-width="4.2" stroke-linecap="round"/>

    <!-- Baseline Start &amp; Peak Filtered Trigger Node -->
    <circle cx="624" cy="178" r="5" fill="#ffffff" stroke="#5856d6" stroke-width="2.8"/>
    <circle cx="828" cy="110" r="13" fill="#10b981" opacity="0.18"/>
    <circle cx="828" cy="110" r="6.8" fill="#10b981" stroke="#ffffff" stroke-width="2.8"/>

    <!-- Right Top Bottom Pill -->
    <rect x="698" y="264" width="228" height="36" rx="18" fill="#e6f7f5"/>
    <text x="812" y="287" text-anchor="middle" font-family="SF Mono, ui-monospace, monospace" font-size="14" font-weight="700" fill="#0d9488">EMG DSP · 20–500 Hz</text>

    <!-- RIGHT BOTTOM CARD: Fragmented UART Byte Stream -> Line Buffer -> Parsed Record -->
    <rect x="574" y="352" width="476" height="272" rx="24" fill="#fbfbfd" stroke="#d2d2d7" stroke-width="1.5"/>

    <!-- Converging Fragment Stream Connectors -->
    <path d="M 702 418 C 730 418, 732 444, 756 444" fill="none" stroke="#0284c7" stroke-width="3.2" stroke-linecap="round"/>
    <line x1="702" y1="464" x2="756" y2="464" stroke="#0071e3" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M 702 510 C 730 510, 732 484, 756 484" fill="none" stroke="#5856d6" stroke-width="3.2" stroke-linecap="round"/>

    <!-- Bridge Arrow to Verified Record -->
    <line x1="864" y1="464" x2="895" y2="464" stroke="#0d9488" stroke-width="3.8" stroke-linecap="round"/>
    <polygon points="892,457 904,464 892,471" fill="#0d9488"/>

    <!-- Left Zone: 3 Incoming Fragmented UART Byte Chunks -->
    <rect x="610" y="404" width="92" height="28" rx="9" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.4"/>
    <rect x="622" y="415" width="32" height="6" rx="3" fill="#0284c7"/>
    <rect x="660" y="415" width="20" height="6" rx="3" fill="#0284c7" opacity="0.45"/>

    <rect x="610" y="450" width="92" height="28" rx="9" fill="#eaf2ff" stroke="#0071e3" stroke-width="2.4"/>
    <rect x="622" y="461" width="24" height="6" rx="3" fill="#0071e3"/>
    <rect x="652" y="461" width="34" height="6" rx="3" fill="#0071e3" opacity="0.52"/>

    <rect x="610" y="496" width="92" height="28" rx="9" fill="#efeffc" stroke="#5856d6" stroke-width="2.4"/>
    <rect x="622" y="507" width="38" height="6" rx="3" fill="#5856d6"/>
    <circle cx="678" cy="510" r="4" fill="#5856d6"/>

    <!-- Center Zone: UART Line-Buffer &amp; Square-Wave Bit Framer -->
    <rect x="756" y="416" width="108" height="96" rx="20" fill="#ffffff" stroke="#5856d6" stroke-width="3"/>
    <!-- Subtle Top Bar inside Framer -->
    <rect x="772" y="432" width="44" height="6" rx="3" fill="#cbd5e1"/>
    <circle cx="842" cy="435" r="4.5" fill="#10b981"/>
    <!-- Crisp TTL UART Square-Wave Bit Frame -->
    <path d="M 772 480 H 782 V 456 H 796 V 480 H 810 V 456 H 826 V 480 H 838 V 456 H 848" fill="none" stroke="#0071e3" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Newline Delimiter Progress Track -->
    <rect x="772" y="492" width="76" height="5" rx="2.5" fill="#e5e5ea"/>
    <rect x="772" y="492" width="54" height="5" rx="2.5" fill="#0d9488"/>

    <!-- Right Zone: Complete Parsed Record Card + Verified Emerald Seal -->
    <rect x="904" y="418" width="110" height="92" rx="18" fill="#eaf8ee" stroke="#10b981" stroke-width="2.8"/>
    <rect x="920" y="436" width="54" height="7" rx="3.5" fill="#0d9488"/>
    <rect x="920" y="451" width="70" height="6.5" rx="3.25" fill="#0d9488" opacity="0.48"/>
    <rect x="920" y="466" width="42" height="6.5" rx="3.25" fill="#0071e3" opacity="0.62"/>
    <circle cx="988" cy="488" r="14.5" fill="#10b981"/>
    <path d="M 982 488 L 986.5 492.5 L 995 483.5" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Right Bottom Pill -->
    <rect x="698" y="564" width="228" height="36" rx="18" fill="#efeffc"/>
    <text x="812" y="587" text-anchor="middle" font-family="SF Mono, ui-monospace, monospace" font-size="14" font-weight="700" fill="#5856d6">UART Framing · 115200</text>

  </g>
</svg>

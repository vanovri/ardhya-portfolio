<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Token Burn Verifier Apple-studio illustration featuring a 5-chain protocol burn pentagon around a BigInt ledger core, real burn vs theater audit fork, and 5-trait credibility shield">
  <title>Token Burn Verifier project illustration</title>
  <defs>
    <linearGradient id="bgGradOuter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbfbfd"/>
      <stop offset="100%" stop-color="#f2f2f7"/>
    </linearGradient>
    <filter id="softShadowOuter" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
    <filter id="chipShadow" x="-16%" y="-16%" width="132%" height="138%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <filter id="nodeShadow" x="-18%" y="-18%" width="136%" height="142%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>
    <pattern id="studioDots" x="61" y="49" width="38" height="38" patternUnits="userSpaceOnUse">
      <circle cx="19" cy="19" r="1.35" fill="#dcdce2"/>
    </pattern>
    <clipPath id="outerCardClip">
      <rect x="64" y="52" width="1072" height="646" rx="22"/>
    </clipPath>
    <linearGradient id="substrateGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="dieSapphire" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="48%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="dieSpecular" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.24"/>
      <stop offset="55%" stop-color="#7dd3fc" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="emeraldSeal" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="55%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="glassBevel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="burnAccent" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#0071e3"/>
      <stop offset="55%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="supplyDropArea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="supplyDropStroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0071e3"/>
      <stop offset="55%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <!-- Outer Studio Canvas + Floating White Frame -->
  <rect width="1200" height="750" fill="url(#bgGradOuter)"/>
  <rect x="48" y="36" width="1104" height="678" rx="30" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.5" filter="url(#softShadowOuter)"/>
  <rect x="64" y="52" width="1072" height="646" rx="22" fill="url(#studioDots)" clip-path="url(#outerCardClip)"/>

  <g transform="translate(48, 36)">

    <!-- LEFT HERO CARD: 5-Chain Protocol Burn Pentagon & Machined BigInt Ledger Core -->
    <rect x="54" y="54" width="492" height="570" rx="24" fill="#fbfbfd" stroke="#d2d2d7" stroke-width="1.5"/>

    <!-- Concentric Verification Aura Rings -->
    <circle cx="300" cy="288" r="182" fill="#f4f8ff" opacity="0.65" stroke="#93c5fd" stroke-width="2" stroke-dasharray="8 6"/>
    <circle cx="300" cy="288" r="126" fill="#ffffff" opacity="0.78" stroke="#dbeafe" stroke-width="2"/>

    <!-- Pentagon Verification Bus & 5 Radial Spokes -->
    <polygon points="300.0,138.0 442.7,241.6 388.2,409.4 211.8,409.4 157.3,241.6" fill="none" stroke="#dbeafe" stroke-width="2.2" stroke-dasharray="5 5"/>
    <line x1="300.0" y1="206.0" x2="300.0" y2="168.0" stroke="#0071e3" stroke-width="3.4" stroke-linecap="round" opacity="0.78"/>
    <line x1="378.0" y1="262.7" x2="414.1" y2="250.9" stroke="#0d9488" stroke-width="3.4" stroke-linecap="round" opacity="0.78"/>
    <line x1="348.2" y1="354.3" x2="370.5" y2="385.1" stroke="#10b981" stroke-width="3.4" stroke-linecap="round" opacity="0.78"/>
    <line x1="251.8" y1="354.3" x2="229.5" y2="385.1" stroke="#5856d6" stroke-width="3.4" stroke-linecap="round" opacity="0.78"/>
    <line x1="222.0" y1="262.7" x2="185.9" y2="250.9" stroke="#0284c7" stroke-width="3.4" stroke-linecap="round" opacity="0.78"/>

    <!-- Grounded Studio Contact Shadow -->
    <ellipse cx="300" cy="390" rx="84" ry="12" fill="#cbd5e1" opacity="0.50"/>

    <!-- 5 Protocol Chain Modules -->
    <!-- 01 Top: Ethereum EIP-1559 Diamond -->
    <g transform="translate(300.0, 138.0)" filter="url(#nodeShadow)">
      <rect x="-27" y="-27" width="54" height="54" rx="15" fill="#ffffff" stroke="#0071e3" stroke-width="2.6"/>
      <rect x="-20" y="-20" width="40" height="40" rx="10" fill="#eaf2ff"/>
      <polygon points="0,-13 10,0 0,5 -10,0" fill="#0071e3"/>
      <polygon points="0,8 10,3 0,14 -10,3" fill="#38bdf8"/>
    </g>

    <!-- 02 Top-Right: Avalanche C-Chain Peak -->
    <g transform="translate(442.7, 241.6)" filter="url(#nodeShadow)">
      <rect x="-27" y="-27" width="54" height="54" rx="15" fill="#ffffff" stroke="#0d9488" stroke-width="2.6"/>
      <rect x="-20" y="-20" width="40" height="40" rx="10" fill="#e6f7f5"/>
      <polygon points="0,-12 12,10 -12,10" fill="none" stroke="#0d9488" stroke-width="3" stroke-linejoin="round"/>
      <polygon points="0,-3 5,7 -5,7" fill="#0d9488"/>
    </g>

    <!-- 03 Bottom-Right: XRP Ledger Waves -->
    <g transform="translate(388.2, 409.4)" filter="url(#nodeShadow)">
      <rect x="-27" y="-27" width="54" height="54" rx="15" fill="#ffffff" stroke="#10b981" stroke-width="2.6"/>
      <rect x="-20" y="-20" width="40" height="40" rx="10" fill="#eaf8ee"/>
      <path d="M -11 -9 Q 0 1 11 -9" fill="none" stroke="#10b981" stroke-width="3.2" stroke-linecap="round"/>
      <path d="M -11 9 Q 0 -1 11 9" fill="none" stroke="#10b981" stroke-width="3.2" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="3" fill="#059669"/>
    </g>

    <!-- 04 Bottom-Left: BNB Auto-Burn Diamond -->
    <g transform="translate(211.8, 409.4)" filter="url(#nodeShadow)">
      <rect x="-27" y="-27" width="54" height="54" rx="15" fill="#ffffff" stroke="#5856d6" stroke-width="2.6"/>
      <rect x="-20" y="-20" width="40" height="40" rx="10" fill="#efeffc"/>
      <polygon points="0,-12 12,0 0,12 -12,0" fill="none" stroke="#5856d6" stroke-width="2.8" stroke-linejoin="round"/>
      <polygon points="0,-5 5,0 0,5 -5,0" fill="#5856d6"/>
    </g>

    <!-- 05 Top-Left: Helium BME Radio Rings -->
    <g transform="translate(157.3, 241.6)" filter="url(#nodeShadow)">
      <rect x="-27" y="-27" width="54" height="54" rx="15" fill="#ffffff" stroke="#0284c7" stroke-width="2.6"/>
      <rect x="-20" y="-20" width="40" height="40" rx="10" fill="#e0f2fe"/>
      <circle cx="0" cy="0" r="11" fill="none" stroke="#0284c7" stroke-width="2.4" stroke-dasharray="5 3"/>
      <circle cx="0" cy="0" r="5" fill="#0284c7"/>
    </g>

    <!-- Centerpiece: Machined Aluminum & Sapphire-Graphite BigInt Supply Audit Core -->
    <rect x="224" y="212" width="152" height="152" rx="30" fill="url(#substrateGrad)" stroke="#93c5fd" stroke-width="2.5" filter="url(#chipShadow)"/>
    <rect x="232" y="220" width="136" height="136" rx="23" fill="#eaf2ff" stroke="#ffffff" stroke-width="2"/>
    <rect x="242" y="230" width="116" height="116" rx="18" fill="url(#dieSapphire)" stroke="#0f172a" stroke-width="2"/>
    <path d="M 260 232 H 340 A 16 16 0 0 1 356 248 V 278 L 244 316 V 248 A 16 16 0 0 1 260 232 Z" fill="url(#dieSpecular)"/>
    <rect x="248" y="236" width="104" height="104" rx="13" fill="none" stroke="#ffffff" stroke-width="1.3" opacity="0.22"/>

    <!-- Sculpted Deflationary Burn & Exact Supply-Step Bars inside Core -->
    <path d="M 300 250 C 314 265, 322 277, 322 289 C 322 302, 312 311, 300 311 C 288 311, 278 302, 278 289 C 278 279, 284 270, 290 264 C 290 272, 295 275, 297 273 C 300 268, 299 258, 300 250 Z" fill="url(#burnAccent)"/>
    <path d="M 300 278 C 306 285, 309 291, 309 296 C 309 302, 305 306, 300 306 C 295 306, 291 302, 291 296 C 291 291, 294 285, 300 278 Z" fill="#ffffff" opacity="0.88"/>
    <!-- Zero-Float Precision Supply Bars -->
    <rect x="266" y="320" width="22" height="6" rx="3" fill="#38bdf8"/>
    <rect x="292" y="320" width="16" height="6" rx="3" fill="#60a5fa"/>
    <rect x="312" y="320" width="10" height="6" rx="3" fill="#34d399"/>

    <!-- Verified Emerald Micro-Seal -->
    <circle cx="352" cy="340" r="18" fill="#ffffff" stroke="#a7f3d0" stroke-width="2.6"/>
    <circle cx="352" cy="340" r="12.5" fill="#10b981"/>
    <path d="M 346.5 340 L 350.5 344 L 358 335.5" fill="none" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Left Card Bottom Pill -->
    <rect x="184" y="546" width="232" height="36" rx="18" fill="#eaf2ff"/>
    <text x="300" y="569" text-anchor="middle" font-family="SF Mono, ui-monospace, monospace" font-size="14" font-weight="700" fill="#0071e3">5 Chains · BigInt Math</text>

    <!-- RIGHT TOP CARD: Net Supply Telemetry — Real _burn() Drop vs Theater Wash-Mint -->
    <rect x="574" y="54" width="476" height="272" rx="24" fill="#fbfbfd" stroke="#d2d2d7" stroke-width="1.5"/>

    <!-- Precision Instrument Viewport -->
    <rect x="610" y="84" width="404" height="154" rx="18" fill="#ffffff" stroke="#e5e5ea" stroke-width="2"/>
    <!-- Subtle Instrument Gridlines -->
    <line x1="628" y1="114" x2="996" y2="114" stroke="#f1f5f9" stroke-width="1.4"/>
    <line x1="628" y1="146" x2="996" y2="146" stroke="#f1f5f9" stroke-width="1.4"/>
    <line x1="628" y1="178" x2="996" y2="178" stroke="#f1f5f9" stroke-width="1.4"/>
    <line x1="628" y1="214" x2="996" y2="214" stroke="#e2e8f0" stroke-width="1.8"/>
    <!-- Theater Anti-Pattern Baseline (Flat/Inflating Coral Dashed Curve + Reject Node) -->
    <path d="M 632 122 L 716 118 L 792 126 L 876 116 L 976 112" fill="none" stroke="#ff3b30" stroke-width="3.2" stroke-dasharray="7 6" stroke-linecap="round" opacity="0.72"/>
    <circle cx="976" cy="112" r="11" fill="#ffeceb" stroke="#ff3b30" stroke-width="2.6"/>
    <path d="M 972 108 L 980 116 M 980 108 L 972 116" stroke="#ff3b30" stroke-width="2.4" stroke-linecap="round"/>
    <!-- Real Protocol Burn Deflationary Step Curve + Area Wash -->
    <polygon points="632,214 632,124 700,124 700,144 768,144 768,162 836,162 836,182 904,182 904,198 976,198 976,214" fill="url(#supplyDropArea)"/>
    <polyline points="632,124 700,124 700,144 768,144 768,162 836,162 836,182 904,182 904,198 976,198" fill="none" stroke="url(#supplyDropStroke)" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="632" cy="124" r="5.5" fill="#ffffff" stroke="#0071e3" stroke-width="3"/>
    <circle cx="976" cy="198" r="13" fill="#10b981" opacity="0.20"/>
    <circle cx="976" cy="198" r="7" fill="#10b981" stroke="#ffffff" stroke-width="2.8"/>

    <!-- Right Top Bottom Pill -->
    <rect x="698" y="264" width="228" height="36" rx="18" fill="#e6f7f5"/>
    <text x="812" y="287" text-anchor="middle" font-family="SF Mono, ui-monospace, monospace" font-size="14" font-weight="700" fill="#0d9488">Real Burn vs Theater</text>

    <!-- RIGHT BOTTOM CARD: 4 Solidity Reference Contracts -> Radial Credibility Gauge -->
    <rect x="574" y="352" width="476" height="272" rx="24" fill="#fbfbfd" stroke="#d2d2d7" stroke-width="1.5"/>

    <!-- Left Zone: 4 Solidity Contract Modules (3 Verified + 1 Quarantined Anti-Pattern) -->
    <rect x="608" y="388" width="184" height="30" rx="10" fill="#eaf2ff" stroke="#0071e3" stroke-width="2.2"/>
    <rect x="622" y="399" width="82" height="7" rx="3.5" fill="#0071e3" opacity="0.82"/>
    <circle cx="774" cy="403" r="8" fill="#10b981"/>
    <path d="M 770.5 403 L 773 405.5 L 777.5 400.5" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="608" y="426" width="184" height="30" rx="10" fill="#e6f7f5" stroke="#0d9488" stroke-width="2.2"/>
    <rect x="622" y="437" width="96" height="7" rx="3.5" fill="#0d9488" opacity="0.82"/>
    <circle cx="774" cy="441" r="8" fill="#10b981"/>
    <path d="M 770.5 441 L 773 443.5 L 777.5 438.5" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="608" y="464" width="184" height="30" rx="10" fill="#efeffc" stroke="#5856d6" stroke-width="2.2"/>
    <rect x="622" y="475" width="74" height="7" rx="3.5" fill="#5856d6" opacity="0.82"/>
    <circle cx="774" cy="479" r="8" fill="#10b981"/>
    <path d="M 770.5 479 L 773 481.5 L 777.5 476.5" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="608" y="502" width="184" height="30" rx="10" fill="#ffeceb" stroke="#ff3b30" stroke-width="2.2" stroke-dasharray="5 3"/>
    <rect x="622" y="513" width="66" height="7" rx="3.5" fill="#ff3b30" opacity="0.58"/>
    <circle cx="774" cy="517" r="8" fill="#ffffff" stroke="#ff3b30" stroke-width="2.2"/>
    <path d="M 771 514 L 777 520 M 777 514 L 771 520" stroke="#ff3b30" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Bridge Connector -->
    <line x1="806" y1="459" x2="844" y2="459" stroke="#0d9488" stroke-width="3.6" stroke-linecap="round"/>
    <polygon points="841,452 854,459 841,466" fill="#0d9488"/>

    <!-- Right Zone: Precision 5-Segment Radial Credibility Ring (cx=938, cy=459) -->
    <circle cx="938" cy="459" r="64" fill="#ffffff" stroke="#e5e5ea" stroke-width="2"/>
    <circle cx="938" cy="459" r="48" fill="none" stroke="#eaf8ee" stroke-width="12"/>
    <!-- 5 Segmented Verified Arcs -->
    <circle cx="938" cy="459" r="48" fill="none" stroke="#10b981" stroke-width="11" stroke-dasharray="50 10.3" stroke-linecap="round" transform="rotate(-90 938 459)"/>
    <circle cx="938" cy="459" r="28" fill="#eaf8ee" stroke="#a7f3d0" stroke-width="2.4"/>
    <path d="M 926 459 L 934 467 L 951 449" fill="none" stroke="#10b981" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Right Bottom Pill -->
    <rect x="688" y="564" width="248" height="36" rx="18" fill="#eaf8ee"/>
    <text x="812" y="587" text-anchor="middle" font-family="SF Mono, ui-monospace, monospace" font-size="14" font-weight="700" fill="#28a745">Solidity · 5-Trait Gate</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="13-Domain Deep Learning Portfolio Suite on 4 GB VRAM Apple-studio preview showing 4 GB silicon budget bars, 14-band geospatial ROC-AUC 0.9771, 5160-DOM 3D neutrino reconstruction, 4-qubit hybrid quantum VQC, and 149/149 pytest badge">
  <title>13-Domain Deep Learning Portfolio Suite on 4 GB VRAM</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbfbfd"/>
      <stop offset="100%" stop-color="#f2f2f7"/>
    </linearGradient>
    <linearGradient id="die" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="barBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0071e3"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="barGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="barAmber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-6%" y="-6%" width="112%" height="116%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect x="48" y="36" width="1104" height="678" rx="30" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.5" filter="url(#shadow)"/>
  <g transform="translate(48, 36)">
    <!-- Left Card: 4 GB Silicon Budget & 4 Flagship Tensor Modalities -->
    <rect x="46" y="46" width="490" height="586" rx="24" fill="#fbfbfd" stroke="#d2d2d7" stroke-width="1.5"/>
    <rect x="76" y="76" width="430" height="220" rx="20" fill="url(#die)" stroke="#0f172a" stroke-width="1.5"/>
    <text x="102" y="114" font-family="SF Mono, ui-monospace, monospace" font-size="13" font-weight="700" fill="#38bdf8">GTX 1650 Ti · 4,096 MB CEILING</text>
    <text x="102" y="156" font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="700" fill="#f8fafc">13 DL Domains</text>
    <text x="102" y="190" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#cbd5e1">12/13 Real Public + 1 Physics-Calibrated</text>
    <rect x="102" y="218" width="174" height="36" rx="18" fill="#10b981" fill-opacity="0.18" stroke="#34d399" stroke-width="1.2"/>
    <text x="189" y="241" text-anchor="middle" font-family="SF Mono, ui-monospace, monospace" font-size="13" font-weight="700" fill="#34d399">149/149 Pytest</text>
    <rect x="290" y="218" width="186" height="36" rx="18" fill="#38bdf8" fill-opacity="0.16" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="383" y="241" text-anchor="middle" font-family="SF Mono, ui-monospace, monospace" font-size="13" font-weight="700" fill="#7dd3fc">17 - 2,635 MB</text>

    <!-- 4 Flagship Modality Chips -->
    <rect x="76" y="320" width="206" height="122" rx="16" fill="#ffffff" stroke="#dbeafe" stroke-width="1.5"/>
    <text x="94" y="350" font-family="SF Mono, ui-monospace, monospace" font-size="12" font-weight="700" fill="#0071e3">09 · 14-BAND HDF5</text>
    <text x="94" y="384" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="700" fill="#0f172a">0.9771 AUC</text>
    <text x="94" y="414" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#64748b">Landslide4Sense SDSS</text>

    <rect x="300" y="320" width="206" height="122" rx="16" fill="#ffffff" stroke="#d1fae5" stroke-width="1.5"/>
    <text x="318" y="350" font-family="SF Mono, ui-monospace, monospace" font-size="12" font-weight="700" fill="#0d9488">07 · 16 Hz DSP</text>
    <text x="318" y="384" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="700" fill="#0f172a">89.33% Acc</text>
    <text x="318" y="414" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#64748b">WESAD 15 Subj Bi-LSTM</text>

    <rect x="76" y="460" width="206" height="122" rx="16" fill="#ffffff" stroke="#fef3c7" stroke-width="1.5"/>
    <text x="94" y="490" font-family="SF Mono, ui-monospace, monospace" font-size="12" font-weight="700" fill="#d97706">10 · 5,160-DOM 3D</text>
    <text x="94" y="524" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="700" fill="#0f172a">-48.6% MAE</text>
    <text x="94" y="554" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#64748b">5.65 deg vs 11.0 LineFit</text>

    <rect x="300" y="460" width="206" height="122" rx="16" fill="#ffffff" stroke="#ede9fe" stroke-width="1.5"/>
    <text x="318" y="490" font-family="SF Mono, ui-monospace, monospace" font-size="12" font-weight="700" fill="#6d28d9">12 · 4-QUBIT VQC</text>
    <text x="318" y="524" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="700" fill="#0f172a">0.9350 AUC</text>
    <text x="318" y="554" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#64748b">BBBP + Credit (17.4 MB)</text>

    <!-- Right Card: Peak VRAM Envelope & Cross-Domain Matrix -->
    <rect x="564" y="46" width="494" height="586" rx="24" fill="#fbfbfd" stroke="#d2d2d7" stroke-width="1.5"/>
    <text x="598" y="94" font-family="SF Mono, ui-monospace, monospace" font-size="13" font-weight="700" fill="#0071e3">MEASURED PEAK VRAM ENVELOPE (MB)</text>
    <line x1="996" y1="116" x2="996" y2="554" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="990" y="110" text-anchor="end" font-family="SF Mono, ui-monospace, monospace" font-size="11" font-weight="700" fill="#ef4444">4,096 MB LIMIT</text>

    <!-- Bars -->
    <g font-family="SF Mono, ui-monospace, monospace" font-size="12" fill="#334155">
      <text x="598" y="150">08 IndoBERT-Base</text><rect x="748" y="135" width="160" height="20" rx="10" fill="url(#barAmber)"/><text x="916" y="150" font-weight="700">2,636 MB</text>
      <text x="598" y="196">02 Cervical UNet</text><rect x="748" y="181" width="76" height="20" rx="10" fill="url(#barAmber)"/><text x="832" y="196" font-weight="700">1,153 MB</text>
      <text x="598" y="242">03 Corrosion UNet</text><rect x="748" y="227" width="74" height="20" rx="10" fill="url(#barAmber)"/><text x="830" y="242" font-weight="700">1,123 MB</text>
      <text x="598" y="288">05 Car + 06 YOLO</text><rect x="748" y="273" width="44" height="20" rx="10" fill="url(#barBlue)"/><text x="800" y="288" font-weight="700">618 MB</text>
      <text x="598" y="334">09 Landslide 14B</text><rect x="748" y="319" width="42" height="20" rx="10" fill="url(#barBlue)"/><text x="798" y="334" font-weight="700">592 MB</text>
      <text x="598" y="380">04 PlantVillage</text><rect x="748" y="365" width="38" height="20" rx="10" fill="url(#barBlue)"/><text x="794" y="380" font-weight="700">545 MB</text>
      <text x="598" y="426">01 Eye Grad-CAM</text><rect x="748" y="411" width="26" height="20" rx="10" fill="url(#barBlue)"/><text x="782" y="426" font-weight="700">314 MB</text>
      <text x="598" y="472">10 IceCube 3D</text><rect x="748" y="457" width="16" height="20" rx="10" fill="url(#barGreen)"/><text x="772" y="472" font-weight="700">148 MB</text>
      <text x="598" y="518">07/11/13 + 12 QNN</text><rect x="748" y="503" width="10" height="20" rx="10" fill="url(#barGreen)"/><text x="766" y="518" font-weight="700">17 - 86 MB</text>
    </g>

    <rect x="598" y="562" width="426" height="42" rx="14" fill="#eaf2ff"/>
    <text x="811" y="588" text-anchor="middle" font-family="SF Mono, ui-monospace, monospace" font-size="13" font-weight="700" fill="#0071e3">v1.0.0 · PyTorch 2.6 CUDA 12.4 · CI GREEN</text>
  </g>
</svg>

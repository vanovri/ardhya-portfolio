<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-labelledby="title desc">
  <title id="title">AGY × Codex Video Studio Pipeline</title>
  <desc id="desc">Programmatic 1080x1920 30fps video production pipeline showing 48 kHz 120 BPM stereo PCM synthesis, ASR ghost trimmer, 5-scene HyperFrames timeline and 100% pytest coverage with 96.88% AST mutation kill score.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f6"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="waveFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="shadow" x="-6%" y="-8%" width="112%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; fill: #0f172a; }
      .mono { font-family: "JetBrains Mono", "SF Mono", Consolas, monospace; fill: #334155; }
      .muted { fill: #64748b; }
      .teal { fill: #0f766e; }
      .blue { fill: #1d4ed8; }
    </style>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect x="44" y="38" width="1112" height="674" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Window Chrome -->
  <path d="M72 39h1056a27 27 0 0 1 27 27v36H45V66a27 27 0 0 1 27-27Z" fill="#f8fafc"/>
  <line x1="45" y1="102" x2="1155" y2="102" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="80" cy="71" r="6.5" fill="#f87171"/>
  <circle cx="102" cy="71" r="6.5" fill="#fbbf24"/>
  <circle cx="124" cy="71" r="6.5" fill="#34d399"/>
  <text x="600" y="77" text-anchor="middle" class="mono" font-size="15" font-weight="600">agy_codex_studio · 1080×1920 30fps · 48 kHz PCM · 200/200 pytest (100% cov)</text>

  <!-- Left Panel: 9:16 Vertical Render Frame Preview -->
  <rect x="80" y="132" width="330" height="546" rx="22" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <rect x="98" y="154" width="136" height="26" rx="13" fill="#134e4a"/>
  <circle cx="114" cy="167" r="4" fill="#2dd4bf"/>
  <text x="126" y="172" class="mono" font-size="11" font-weight="700" fill="#99f6e4">9:16 HYPERFRAMES</text>
  <text x="390" y="172" text-anchor="end" class="mono" font-size="11" fill="#94a3b8">1080×1920</text>

  <text x="102" y="214" class="sans" font-size="20" font-weight="700" fill="#f8fafc">SignalProof × ENVIID</text>
  <text x="102" y="236" class="mono" font-size="12" fill="#38bdf8">50 Hz Biquad Notch: -25.5 dB</text>

  <!-- Mini Frequency Curve inside 9:16 Viewport -->
  <rect x="100" y="254" width="290" height="162" rx="12" fill="#1e293b" stroke="#334155"/>
  <path d="M114 294 L165 294 L198 297 L218 315 L232 392 L246 315 L266 297 L315 295 L376 295" fill="none" stroke="#2dd4bf" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="232" y1="266" x2="232" y2="404" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="232" cy="392" r="5" fill="#f43f5e"/>
  <text x="244" y="396" class="mono" font-size="11" font-weight="600" fill="#fda4af">50.0 Hz (-25.5 dB)</text>

  <!-- Safe-Area Word-Timed Caption Band inside 9:16 Viewport -->
  <rect x="100" y="436" width="290" height="74" rx="12" fill="#111827" stroke="#0d9488" stroke-width="1.5"/>
  <text x="245" y="464" text-anchor="middle" class="mono" font-size="11" fill="#5eead4">CAPTION SAFE BAND (y: 0.72)</text>
  <text x="245" y="490" text-anchor="middle" class="sans" font-size="15" font-weight="700" fill="#ffffff">"Deterministic <tspan fill="#2dd4bf">SHA-256</tspan> bundle"</text>

  <!-- Render Verification Footer inside 9:16 Viewport -->
  <rect x="100" y="528" width="290" height="126" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="116" y="554" class="mono" font-size="12" font-weight="700" fill="#e2e8f0">DELIVERY OUTPUTS (H.264 / AAC)</text>
  <text x="116" y="578" class="mono" font-size="11" fill="#94a3b8">• signalproof-enviid (36.0s, 1080p)</text>
  <text x="116" y="598" class="mono" font-size="11" fill="#94a3b8">• quad-showcase (24.0s, 1080×1920)</text>
  <text x="116" y="618" class="mono" font-size="11" fill="#94a3b8">• benchmind-v02 (24.0s, 1920×1080)</text>
  <text x="116" y="638" class="mono" font-size="11" fill="#94a3b8">• redflag-loop (24.0s, 1920×1080)</text>

  <!-- Right Top Panel: 5-Scene Timeline + DSP Synth -->
  <rect x="438" y="132" width="682" height="258" rx="20" fill="url(#cardGrad)" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="466" y="168" class="sans" font-size="18" font-weight="700">1. Multi-Scene Timeline &amp; 48 kHz Stereo PCM Synthesizer</text>
  <text x="1092" y="168" text-anchor="end" class="mono" font-size="13" font-weight="600" fill="#0f766e">120 BPM · 1,728,000 frames</text>

  <!-- 5 Scene Blocks -->
  <g transform="translate(466, 186)">
    <rect x="0" y="0" width="118" height="54" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
    <text x="12" y="22" class="mono" font-size="11" font-weight="700" fill="#0f766e">S1 · 0–6s</text>
    <text x="12" y="40" class="sans" font-size="12" font-weight="600">Hook &amp; Glitch</text>

    <rect x="128" y="0" width="124" height="54" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="140" y="22" class="mono" font-size="11" font-weight="700" fill="#1d4ed8">S2 · 6–14s</text>
    <text x="140" y="40" class="sans" font-size="12" font-weight="600">6-Metric Gate</text>

    <rect x="262" y="0" width="124" height="54" rx="10" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
    <text x="274" y="22" class="mono" font-size="11" font-weight="700" fill="#0f766e">S3 · 14–22s</text>
    <text x="274" y="40" class="sans" font-size="12" font-weight="600">3D FFT Notch</text>

    <rect x="396" y="0" width="124" height="54" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="408" y="22" class="mono" font-size="11" font-weight="700" fill="#1d4ed8">S4 · 22–30s</text>
    <text x="408" y="40" class="sans" font-size="12" font-weight="600">dMRV Merkle</text>

    <rect x="530" y="0" width="96" height="54" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
    <text x="542" y="22" class="mono" font-size="11" font-weight="700" fill="#334155">S5 · 30–36s</text>
    <text x="542" y="40" class="sans" font-size="12" font-weight="600">Audit Card</text>
  </g>

  <!-- Stereo Waveform Track -->
  <rect x="466" y="256" width="626" height="108" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <path d="M482 310 L500 282 L518 332 L536 274 L554 340 L572 288 L590 326 L608 270 L626 344 L644 285 L662 330 L680 276 L698 338 L716 292 L734 324 L752 268 L770 346 L788 284 L806 332 L824 275 L842 338 L860 290 L878 326 L896 272 L914 342 L932 286 L950 330 L968 278 L986 336 L1004 294 L1022 322 L1040 288 L1058 318 L1076 310" fill="none" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="484" y="278" class="mono" font-size="11" font-weight="600" fill="#0f766e">ghost_trimmer.py + soundtrack_synth.py (16-bit PCM WAV, RIFF aligned)</text>
  <text x="484" y="350" class="mono" font-size="11" fill="#64748b">Retake pruning · Pause compression · SRT / WebVTT word-timestamp sync</text>

  <!-- Right Bottom Panel: TDD Hardening, Property Fuzzer & AST Mutation Score -->
  <rect x="438" y="414" width="682" height="264" rx="20" fill="url(#cardGrad)" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="466" y="452" class="sans" font-size="18" font-weight="700">2. Zero-Dependency TDD, Property Fuzzer &amp; AST Mutation Gate</text>
  <rect x="938" y="430" width="154" height="30" rx="15" fill="#dcfce7" stroke="#16a34a"/>
  <text x="1015" y="450" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#15803d">ALL GATES PASS</text>

  <!-- 3 Metric Cards -->
  <g transform="translate(466, 474)">
    <rect x="0" y="0" width="196" height="114" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="18" y="30" class="mono" font-size="12" font-weight="600" fill="#64748b">LINE COVERAGE</text>
    <text x="18" y="72" class="sans" font-size="34" font-weight="800" fill="#0f766e">100.0%</text>
    <text x="18" y="96" class="mono" font-size="11" fill="#334155">1,889 / 1,889 stmts (200 tests)</text>

    <rect x="215" y="0" width="196" height="114" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="233" y="30" class="mono" font-size="12" font-weight="600" fill="#64748b">AST MUTATION KILL</text>
    <text x="233" y="72" class="sans" font-size="34" font-weight="800" fill="#1d4ed8">96.88%</text>
    <text x="233" y="96" class="mono" font-size="11" fill="#334155">62 / 64 AST mutants killed</text>

    <rect x="430" y="0" width="196" height="114" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="448" y="30" class="mono" font-size="12" font-weight="600" fill="#64748b">PROPERTY FUZZER</text>
    <text x="448" y="72" class="sans" font-size="34" font-weight="800" fill="#0f172a">2,500</text>
    <text x="448" y="96" class="mono" font-size="11" fill="#334155">Seeded invariant fuzz cases</text>
  </g>

  <!-- Sub-footer inside Right Bottom Panel -->
  <rect x="466" y="606" width="626" height="48" rx="10" fill="#f1f5f9"/>
  <text x="484" y="635" class="mono" font-size="12" fill="#334155">20 bugs fixed in BUGS_FIXED.md · SHA-256 contract &amp; MP4 digest lock verified</text>
</svg>

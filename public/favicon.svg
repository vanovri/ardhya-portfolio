<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <title>Ardhya Novri Ramadhan</title>
  <defs>
    <!-- Tactile Cupertino Porcelain-Glass Squircle Surface -->
    <linearGradient id="sqBg" x1="8" y1="4" x2="56" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="52%" stop-color="#F5F8FD"/>
      <stop offset="100%" stop-color="#E5EEF9"/>
    </linearGradient>
    <!-- Subtle Ambient Azure Glow in Lower Basin -->
    <radialGradient id="sqGlow" cx="32" cy="46" r="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0071E3" stop-opacity="0.15"/>
      <stop offset="65%" stop-color="#00B4D8" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0071E3" stop-opacity="0"/>
    </radialGradient>
    <!-- Squircle Border Gradient (Bright Specular Top -> Soft Cool Rim Bottom) -->
    <linearGradient id="sqBorder" x1="12" y1="2" x2="52" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#D2DFEE" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#B4C5DC" stop-opacity="0.95"/>
    </linearGradient>
    <!-- Primary Sculptural "A" Arch Gradient (Deep Obsidian -> Cobalt Ink) -->
    <linearGradient id="archGrad" x1="18" y1="14" x2="46" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="55%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <!-- Iconly Fluid Signal Wave ("N" / Crossbar) Gradient (Apple Electric Blue -> Cyan) -->
    <linearGradient id="waveGrad" x1="14" y1="38" x2="50" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0058B8"/>
      <stop offset="50%" stop-color="#0071E3"/>
      <stop offset="100%" stop-color="#00B4D8"/>
    </linearGradient>
    <!-- Secondary Bulk Duotone Under-Glow Halo -->
    <radialGradient id="bulkTint" cx="32" cy="33" r="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0071E3" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#0D9488" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#0071E3" stop-opacity="0"/>
    </radialGradient>
    <!-- Zero-Clip UserSpace Tactile 3D Elevation Shadows -->
    <filter id="glyphShadow" filterUnits="userSpaceOnUse" x="0" y="0" width="64" height="64" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2.4" stdDeviation="2.2" flood-color="#00336E" flood-opacity="0.20"/>
    </filter>
    <filter id="waveShadow" filterUnits="userSpaceOnUse" x="0" y="0" width="64" height="64" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2.0" stdDeviation="1.8" flood-color="#0066CC" flood-opacity="0.34"/>
    </filter>
  </defs>

  <!-- 1. Continuous-Curvature Apple iOS Superellipse Squircle -->
  <path d="M 32,1.5 C 49.5,1.5 55.8,1.5 59.15,4.85 C 62.5,8.2 62.5,14.5 62.5,32 C 62.5,49.5 62.5,55.8 59.15,59.15 C 55.8,62.5 49.5,62.5 32,62.5 C 14.5,62.5 8.2,62.5 4.85,59.15 C 1.5,55.8 1.5,49.5 1.5,32 C 1.5,14.5 1.5,8.2 4.85,4.85 C 8.2,1.5 14.5,1.5 32,1.5 Z" fill="url(#sqBg)"/>
  <path d="M 32,1.5 C 49.5,1.5 55.8,1.5 59.15,4.85 C 62.5,8.2 62.5,14.5 62.5,32 C 62.5,49.5 62.5,55.8 59.15,59.15 C 55.8,62.5 49.5,62.5 32,62.5 C 14.5,62.5 8.2,62.5 4.85,59.15 C 1.5,55.8 1.5,49.5 1.5,32 C 1.5,14.5 1.5,8.2 4.85,4.85 C 8.2,1.5 14.5,1.5 32,1.5 Z" fill="url(#sqGlow)"/>

  <!-- Inner Specular Top Highlight Arc -->
  <path d="M 7,6.5 C 12,3.2 20,2.8 32,2.8 C 44,2.8 52,3.2 57,6.5" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.92"/>

  <!-- Outer Precision Rim -->
  <path d="M 32,1.5 C 49.5,1.5 55.8,1.5 59.15,4.85 C 62.5,8.2 62.5,14.5 62.5,32 C 62.5,49.5 62.5,55.8 59.15,59.15 C 55.8,62.5 49.5,62.5 32,62.5 C 14.5,62.5 8.2,62.5 4.85,59.15 C 1.5,55.8 1.5,49.5 1.5,32 C 1.5,14.5 1.5,8.2 4.85,4.85 C 8.2,1.5 14.5,1.5 32,1.5 Z" fill="none" stroke="url(#sqBorder)" stroke-width="1.4"/>

  <!-- 2. Iconly Bulk Soft Halo Under-Layer -->
  <circle cx="32" cy="33" r="18" fill="url(#bulkTint)"/>

  <!-- 3. Primary Centered Sculptural Rounded "A" Arch (Zero Sharp Angles) -->
  <g filter="url(#glyphShadow)">
    <path d="M 18.0,46.0 L 28.4,19.6 C 29.8,16.0 34.2,16.0 35.6,19.6 L 46.0,46.0" fill="none" stroke="url(#archGrad)" stroke-width="7.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 4. Iconly Fluid Harmonic Wave Crossbar ("AN" Sinusoidal Ribbon) -->
  <g filter="url(#waveShadow)">
    <path d="M 14.2,37.2 C 20.8,28.8 26.8,29.0 32.0,34.8 C 37.2,40.6 43.2,40.8 49.8,32.4" fill="none" stroke="url(#waveGrad)" stroke-width="6.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Specular Glass Highlight on the Wave Ribbon -->
  <path d="M 15.6,35.8 C 21.2,29.5 26.5,29.6 31.6,34.5" fill="none" stroke="#FFFFFF" stroke-width="1.35" stroke-linecap="round" opacity="0.62"/>
</svg>

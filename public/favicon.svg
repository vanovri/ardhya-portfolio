<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <title>Ardhya Novri Ramadhan</title>
  <defs>
    <linearGradient id="sqBg" x1="8" y1="4" x2="56" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#F6F8FB"/>
      <stop offset="100%" stop-color="#ECEFF5"/>
    </linearGradient>
    <linearGradient id="sqBorder" x1="12" y1="2" x2="52" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#DCE1E9" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#C5CCD8" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="archGrad" x1="18" y1="15" x2="44" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#23252A"/>
      <stop offset="100%" stop-color="#14161A"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="42" y1="41" x2="47" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A84FF"/>
      <stop offset="100%" stop-color="#0066CC"/>
    </linearGradient>
    <filter id="glyphShadow" filterUnits="userSpaceOnUse" x="0" y="0" width="64" height="64" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="1.8" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.11"/>
    </filter>
  </defs>

  <!-- 1. Continuous-Curvature Apple iOS Superellipse Squircle -->
  <path d="M 32,1.5 C 49.5,1.5 55.8,1.5 59.15,4.85 C 62.5,8.2 62.5,14.5 62.5,32 C 62.5,49.5 62.5,55.8 59.15,59.15 C 55.8,62.5 49.5,62.5 32,62.5 C 14.5,62.5 8.2,62.5 4.85,59.15 C 1.5,55.8 1.5,49.5 1.5,32 C 1.5,14.5 1.5,8.2 4.85,4.85 C 8.2,1.5 14.5,1.5 32,1.5 Z" fill="url(#sqBg)"/>
  <path d="M 7,6.5 C 12,3.2 20,2.8 32,2.8 C 44,2.8 52,3.2 57,6.5" fill="none" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" opacity="0.9"/>
  <path d="M 32,1.5 C 49.5,1.5 55.8,1.5 59.15,4.85 C 62.5,8.2 62.5,14.5 62.5,32 C 62.5,49.5 62.5,55.8 59.15,59.15 C 55.8,62.5 49.5,62.5 32,62.5 C 14.5,62.5 8.2,62.5 4.85,59.15 C 1.5,55.8 1.5,49.5 1.5,32 C 1.5,14.5 1.5,8.2 4.85,4.85 C 8.2,1.5 14.5,1.5 32,1.5 Z" fill="none" stroke="url(#sqBorder)" stroke-width="1.35"/>

  <g filter="url(#glyphShadow)">
    <!-- 2. Unified Sculptural Rounded "A" Arch + Clean Straight Crossbar -->
    <path d="M 18.5,46.0 L 28.6,19.4 C 29.9,16.0 34.1,16.0 35.4,19.4 L 41.2,34.8 H 23.2" fill="none" stroke="url(#archGrad)" stroke-width="6.6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 3. Signature Apple Blue Tactile Right-Foot Capsule -->
    <path d="M 44.5,43.4 L 45.5,46.0" fill="none" stroke="url(#accentGrad)" stroke-width="6.8" stroke-linecap="round"/>
  </g>
</svg>
